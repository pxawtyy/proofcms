name: proofcms-wp-base

services:
  db:
    image: mariadb:10.11@sha256:7d829180b5b2a9ba74f6242876ab401a0d7dd338a807e522ef92bc9698760f20
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: proofcms
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40
    volumes:
      - db:/var/lib/mysql
    networks: [lab]

  wordpress:
    image: wordpress:6.4.3-php8.2-apache@sha256:8ae66efb09a2cc4f1ce44414c52b0ce4198c1f8ed338a6f51910bc09cd7d8bbb
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    ports:
      - "127.0.0.1:9212:80"
    volumes:
      - wordpress:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 80) ? 0 : 1);"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [lab, edge]

  cli:
    image: wordpress:cli-php8.2@sha256:be56991798a70b0491f406f0a088ec3f12b5cb915ab6949dced0d9052861265b
    profiles: [tools]
    entrypoint: ["wp"]
    user: "0:0"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress:/var/www/html
    networks: [lab, edge]

volumes:
  db:
  wordpress:

networks:
  lab:
    internal: true
  edge: {}
