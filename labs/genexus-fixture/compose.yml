name: proofcms-genexus-fixture

services:
  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:9218:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./gxcfg.js:/usr/share/nginx/html/gxcfg.js:ro
    networks: [lab, edge]

networks:
  lab:
    internal: true
  edge: {}
