name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Redaction guard
        run: python -m proofcms.redaction --all

      - name: Lint
        run: ruff check proofcms tests

      - name: Types
        run: mypy proofcms

      - name: Tests
        run: python -m pytest -q
